        unique constraint on client_uuid must be resolved by the database during
        bulk_create, not by a per-row uniqueness query.
      properties:
        client_uuid:
          type: string
          format: uuid
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        accuracy_m:
