  /api/v1/settings/:
    get:
      operationId: v1_settings_retrieve
      description: |-
        GET   /api/v1/settings/ - any signed-in user. The officer app reads the
                                  ping interval from here when a shift starts.
        PATCH /api/v1/settings/ - supervisor only. Partial update.

        Returns a flat object rather than a list of rows, so Android reads
        response.location_ping_interval_seconds without walking a key/value list.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemSetting'
          description: ''
    patch:
      operationId: v1_settings_partial_update
      description: |-
        GET   /api/v1/settings/ - any signed-in user. The officer app reads the
                                  ping interval from here when a shift starts.
        PATCH /api/v1/settings/ - supervisor only. Partial update.

        Returns a flat object rather than a list of rows, so Android reads
        response.location_ping_interval_seconds without walking a key/value list.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedSystemSetting'
            examples:
              SlowThePingIntervalDown:
                value:
                  location_ping_interval_seconds: 60
                summary: Slow the ping interval down
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedSystemSetting'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedSystemSetting'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemSetting'
          description: ''
  /api/v1/settings/schema/:
    get:
      operationId: v1_settings_schema_list
      description: |-
        GET /api/v1/settings/schema/ - what each setting means and its bounds, so
        the supervisor screen can render inputs without hardcoding limits.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SettingDefinition'
          description: ''
  /api/v1/shifts/active/:
    get:
      operationId: v1_shifts_active_list
      description: |-
        GET /api/v1/shifts/active/ — §4.6, the dashboard map.

        Poll this every 15s; §4.6 asks for 15-30s refresh, which polling meets
        without a socket layer.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActiveOfficer'
          description: ''
  /api/v1/shifts/end/:
    post:
      operationId: v1_shifts_end_create
      description: |-
        POST /api/v1/shifts/end/ — §4.2 stops tracking.

        §4.1 also requires the session to end, but revoking the JWT is
        POST /api/v1/logout/'s job; the client calls it separately. Doing it here
        too meant a failed blacklist still returned 200, so a phone could believe
        its session was revoked when it was not.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShiftBoundary'
            examples:
              WithPosition:
                value:
                  latitude: 34.4467
                  longitude: 35.8497
                summary: With position
              NoGPSFix:
                value: {}
                summary: No GPS fix
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ShiftBoundary'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ShiftBoundary'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shift'
          description: ''
  /api/v1/shifts/start/:
    post:
      operationId: v1_shifts_start_create
      description: |-
        POST /api/v1/shifts/start/ — §4.2. Idempotent; retrying is safe.

        Optional body: {"latitude": ..., "longitude": ...} for the position where
        the officer went on duty.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShiftBoundary'
            examples:
              WithPosition:
                value:
                  latitude: 34.4367
                  longitude: 35.8497
                summary: With position
              NoGPSFixYet:
                value: {}
                summary: No GPS fix yet
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ShiftBoundary'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ShiftBoundary'
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shift'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shift'
          description: ''
  /api/v1/shifts/today/:
    get:
      operationId: v1_shifts_today_retrieve
      description: |-
        GET /api/v1/shifts/today/ — the officer's own duty total for today.

        Duty is a daily target worked in as many stints as needed, so the app's
        counter has to come from here: counting from the active shift's start
        resets to zero on every split. Always the caller's own totals; there is
        no way to ask about another officer.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyDuty'
              examples:
                OnShift,SecondStint:
                  value:
                    date: '2026-09-10'
                    duty_seconds_today: 14400
                    target_seconds: 28800
                    active_shift_started_at: '2026-09-10T13:00:00+03:00'
                    active_shift_seconds: 7200
                  summary: On shift, second stint
                OffShift:
                  value:
                    date: '2026-09-10'
                    duty_seconds_today: 7200
                    target_seconds: 28800
                    active_shift_started_at: null
                    active_shift_seconds: 0
                  summary: Off shift
          description: ''
  /api/v1/token/refresh/:
    post:
      operationId: v1_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
