      - title
    NotificationTypeEnum:
      enum:
      - mission_assigned
      - mission_cancelled
      - dispatcher_message
      - panic_alert
      - duty_target_reminder
      type: string
      description: |-
        * `mission_assigned` - Mission Assigned
        * `mission_cancelled` - Mission Cancelled
        * `dispatcher_message` - Dispatcher Message
        * `panic_alert` - Panic Alert
        * `duty_target_reminder` - Duty Target Reminder
    OfficerArea:
      type: object
      description: |-
        One district an officer worked in, and how many of their missions were
        there. `area_id` and `name` are null for a mission that fell outside every
        district.
      properties:
        area_id:
          type: integer
          nullable: true
        name:
          type: string
          nullable: true
        missions:
          type: integer
      required:
      - area_id
      - missions
      - name
    OfficerBrief:
      type: object
      description: |-
        The minimum identifying fields for a person, used by every app that has to
        label a row with an officer. Defined once in core: two apps declaring their
        own version produces two schema components with the same name, which makes
        the generated OpenAPI document wrong.
      properties:
        id:
          type: integer
        full_name:
          type: string
        badge_number:
          type: string
      required:
      - badge_number
      - full_name
      - id
    OfficerCurrentMission:
      type: object
      description: What the officer is on right now, when they are on something.
      properties:
        mission_id:
          type: integer
        title:
          type: string
        status:
          type: string
      required:
      - mission_id
      - status
      - title
    OfficerMission:
      type: object
      description: One line of the mission history, with the timestamps the screen
        shows.
      properties:
        mission_id:
          type: integer
        title:
          type: string
        status:
          type: string
        priority:
          type: string
        category:
          type: string
        area:
          type: string
          nullable: true
        area_id:
          type: integer
          nullable: true
        assigned_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        cancelled_at:
          type: string
          format: date-time
          nullable: true
      required:
      - area
      - area_id
      - assigned_at
      - cancelled_at
      - category
      - completed_at
      - mission_id
      - priority
      - status
      - title
    OfficerPerformance:
      type: object
      description: This officer's own averages, not the period's.
      properties:
        average_completion_seconds:
          type: number
          format: double
      required:
      - average_completion_seconds
    OfficerReport:
      type: object
      description: |-
        GET /api/v1/reports/officer/ - one officer over a day or a range.

        `timeline` is only filled for a single day; over a longer range it is empty
        and the client asks /reports/activity/ for whatever slice it needs.

        `current_status` is where the officer stands now, not during the range:
        available, on_mission, panic or off_duty.
      properties:
        officer:
          $ref: '#/components/schemas/OfficerBrief'
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        current_status:
          type: string
        current_mission:
          allOf:
          - $ref: '#/components/schemas/OfficerCurrentMission'
          nullable: true
        summary:
          $ref: '#/components/schemas/OfficerReportSummary'
        performance:
          $ref: '#/components/schemas/OfficerPerformance'
        timeline:
          type: array
          items:
            $ref: '#/components/schemas/ActivityRow'
        missions:
          type: array
          items:
            $ref: '#/components/schemas/OfficerMission'
      required:
      - current_mission
      - current_status
      - end_date
      - missions
      - officer
      - performance
      - start_date
      - summary
      - timeline
    OfficerReportSummary:
      type: object
      description: The cards at the top of the officer page.
      properties:
        hours_on_duty:
          type: number
          format: double
        distance_covered_m:
          type: integer
        missions_assigned:
          type: integer
        missions_completed:
          type: integer
        missions_cancelled:
          type: integer
        missions_in_progress:
          type: integer
        panic_events:
          type: integer
      required:
      - distance_covered_m
      - hours_on_duty
      - missions_assigned
      - missions_cancelled
      - missions_completed
      - missions_in_progress
      - panic_events
    PaginatedNotificationList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
    PaginatedUserList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/User'
    PanicEvent:
      type: object
      description: |-
        One alert in full — what trigger, cancel, and resolve all return.

        `resolved_by` is expanded rather than left as an id so the dashboard can
        show who closed it without a second request.
      properties:
        id:
          type: integer
          readOnly: true
        shift:
          type: integer
        status:
          $ref: '#/components/schemas/PanicEventStatusEnum'
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        accuracy_m:
          type: number
          format: double
          nullable: true
        battery_level:
          type: integer
          maximum: 100
          minimum: 0
          nullable: true
          description: Percentage, 0-100. A dying battery explains a trail that stops.
        triggered_at:
          type: string
          format: date-time
          readOnly: true
        cancelled_at:
          type: string
          format: date-time
          nullable: true
        resolved_at:
          type: string
          format: date-time
          nullable: true
        resolved_by:
          allOf:
          - $ref: '#/components/schemas/OfficerBrief'
          readOnly: true
          nullable: true
        notes:
          type: string
      required:
      - id
      - latitude
      - longitude
      - resolved_by
      - shift
      - triggered_at
    PanicEventStatusEnum:
      enum:
      - active
      - cancelled
      - resolved
      type: string
      description: |-
        * `active` - Active
        * `cancelled` - Cancelled
        * `resolved` - Resolved
    PanicLocation:
      type: object
      description: |-
        GET /api/v1/panic/{id}/location/ — for an officer on their way to help.

        Narrow on purpose: who it is, how to reach them, and where they are now.
        The outcome columns and the battery belong to the dispatcher feed, not to
        a colleague en route.
      properties:
        id:
          type: integer
        officer:
          $ref: '#/components/schemas/PanicOfficer'
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        accuracy_m:
          type: number
          format: double
          nullable: true
        recorded_at:
          type: string
          format: date-time
      required:
      - accuracy_m
      - id
      - latitude
      - longitude
      - officer
      - recorded_at
    PanicOfficer:
      type: object
      description: |-
        OfficerBrief plus a phone number, for the location endpoint only.

        A colleague on the way needs to be able to call. OfficerBrief itself must
        not grow a phone: it labels mission events, assignment lists, shift rows
        and report exports, and none of those should start handing out numbers.
        A subclass under its own name, so the schema gets a separate component
        instead of a second, different `OfficerBrief`.

        `phone` is an empty string when the officer has none (the column is
        blank=True); the app hides the call button in that case.
      properties:
        id:
          type: integer
        full_name:
          type: string
        badge_number:
          type: string
        phone:
          type: string
      required:
      - badge_number
      - full_name
      - id
      - phone
    PanicResolve:
      type: object
      description: POST /api/v1/panic/{id}/resolve/ body. What happened, in the closer's
        words.
      properties:
        notes:
          type: string
          description: What the alert turned out to be and how it was handled.
    PanicTrigger:
      type: object
      description: |-
        POST /api/v1/panic/ body.

        Position is required, unlike the optional one on Start Shift: an alert the
        dispatcher cannot put on the map is not an alert. Battery and accuracy are
        optional because the phone may not have them, and waiting for a better GPS
        fix before sending is the wrong trade for this button.
      properties:
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        accuracy_m:
          type: number
          format: double
          nullable: true
        battery_level:
          type: integer
          maximum: 100
          minimum: 0
          nullable: true
      required:
      - latitude
      - longitude
    PasswordResetConfirm:
      type: object
      properties:
        badge_number:
          type: string
        code:
          type: string
        new_password:
          type: string
          writeOnly: true
          minLength: 8
      required:
      - badge_number
      - code
      - new_password
    PasswordResetRequest:
      type: object
      properties:
        badge_number:
          type: string
      required:
      - badge_number
    PatchedSystemSetting:
      type: object
      description: |-
        The settings object, flat rather than a list of key/value rows.

        Built from the registry so a new setting appears in the API docs the
        moment it is added to DEFINITIONS — no second place to update.

        Validation still happens in `registry.set_settings`; this exists so
