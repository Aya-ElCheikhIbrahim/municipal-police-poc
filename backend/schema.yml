components:
  schemas:
    ActivePanic:
      type: object
      description: |-
        The contract for GET /api/v1/panic/active/ — what feeds the red pulsing
        marker in §4.6.

        Deliberately narrow: name, badge, and where they are. The outcome columns
        are all empty on an active alert, so sending them would be noise on an
        endpoint every open dashboard polls.
      properties:
        id:
          type: integer
          readOnly: true
        officer:
          allOf:
          - $ref: '#/components/schemas/OfficerBrief'
          readOnly: true
        shift:
          type: integer
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        accuracy_m:
          type: number
          format: double
          nullable: true
        battery_level:
          type: integer
          maximum: 100
          minimum: 0
          nullable: true
          description: Percentage, 0-100. A dying battery explains a trail that stops.
        triggered_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - id
      - latitude
      - longitude
      - officer
      - shift
      - triggered_at
    Assign:
      type: object
      properties:
        officer_id:
          type: integer
      required:
      - officer_id
    Cancel:
      type: object
      properties:
        reason:
          type: string
          description: Required. Stored on the mission and in the timeline.
      required:
      - reason
    Complete:
      type: object
      description: Where the officer was when they started or completed.
      properties:
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        notes:
          type: string
          default: ''
    DailyOfficerReport:
      type: object
      properties:
        officer_id:
          type: integer
        officer_name:
          type: string
        date:
          type: string
          format: date
        hours_on_duty:
          type: number
          format: double
        distance_covered_m:
          type: integer
        missions_assigned:
          type: integer
        missions_completed:
          type: integer
        missions_cancelled:
          type: integer
        panic_events:
          type: integer
      required:
      - date
      - distance_covered_m
      - hours_on_duty
      - missions_assigned
      - missions_cancelled
      - missions_completed
      - officer_id
      - officer_name
      - panic_events
    DeviceToken:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        token:
          type: string
          maxLength: 255
        platform:
          $ref: '#/components/schemas/PlatformEnum'
        device_model:
          type: string
          maxLength: 100
        app_version:
          type: string
          maxLength: 20
      required:
      - id
      - platform
      - token
    EventTypeEnum:
      enum:
      - created
      - assigned
      - reassigned
      - acknowledged
      - started
      - completed
      - cancelled
      - photo_added
      - note_added
      - ack_alert_sent
      type: string
      description: |-
        * `created` - Created
        * `assigned` - Assigned
        * `reassigned` - Reassigned
        * `acknowledged` - Acknowledged
        * `started` - Started
        * `completed` - Completed
        * `cancelled` - Cancelled
        * `photo_added` - Photo added
        * `note_added` - Note added
        * `ack_alert_sent` - Acknowledgement alert sent
    Login:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
      required:
      - password
      - username
    Logout:
      type: object
      properties:
        refresh:
          type: string
      required:
      - refresh
    MissionCreate:
      type: object
      description: Dispatcher creates a mission, optionally assigning it at once.
      properties:
        title:
          type: string
          maxLength: 255
        description:
          type: string
          default: ''
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        address:
          type: string
          default: ''
          maxLength: 255
        priority:
          allOf:
          - $ref: '#/components/schemas/PriorityEnum'
          default: medium
        deadline:
          type: string
          format: date-time
          nullable: true
        assigned_to_id:
          type: integer
          nullable: true
          description: Officer to assign immediately. Optional.
      required:
      - latitude
      - longitude
      - title
    MissionDetail:
      type: object
      description: The drawer. Carries the full lifecycle timeline.
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        priority:
          $ref: '#/components/schemas/PriorityEnum'
        status:
          $ref: '#/components/schemas/Status0aaEnum'
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        address:
          type: string
          maxLength: 255
        assigned_to:
          allOf:
          - $ref: '#/components/schemas/OfficerBrief'
          readOnly: true
        deadline:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        assigned_at:
          type: string
          format: date-time
          nullable: true
        is_overdue:
          type: boolean
          readOnly: true
        awaiting_acknowledgement:
          type: boolean
          description: The dashboard highlights these. Set by the sweep, not here.
          readOnly: true
        description:
          type: string
        created_by:
          allOf:
          - $ref: '#/components/schemas/OfficerBrief'
          readOnly: true
        acknowledged_at:
          type: string
          format: date-time
          nullable: true
        started_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        cancelled_at:
          type: string
          format: date-time
          nullable: true
        started_latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        started_longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        completed_latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        completed_longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        notes:
          type: string
        cancellation_reason:
          type: string
        ack_alert_sent_at:
          type: string
          format: date-time
          nullable: true
        events:
          type: array
          items:
            $ref: '#/components/schemas/MissionEvent'
          readOnly: true
        photos:
          type: array
          items:
            $ref: '#/components/schemas/MissionPhoto'
          readOnly: true
      required:
      - assigned_to
      - awaiting_acknowledgement
      - created_at
      - created_by
      - events
      - id
      - is_overdue
      - latitude
      - longitude
      - photos
      - title
    MissionEvent:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        event_type:
          $ref: '#/components/schemas/EventTypeEnum'
        actor:
          allOf:
          - $ref: '#/components/schemas/OfficerBrief'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        metadata: {}
      required:
      - actor
      - created_at
      - event_type
      - id
    MissionList:
      type: object
      description: |-
        The list row. Deliberately without events and photos: the mission list is
        polled alongside the map, and dragging every event of every mission into
        that response would grow without bound over a shift.
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        priority:
          $ref: '#/components/schemas/PriorityEnum'
        status:
          $ref: '#/components/schemas/Status0aaEnum'
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        address:
          type: string
          maxLength: 255
        assigned_to:
          allOf:
          - $ref: '#/components/schemas/OfficerBrief'
          readOnly: true
        deadline:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        assigned_at:
          type: string
          format: date-time
          nullable: true
        is_overdue:
          type: boolean
          readOnly: true
        awaiting_acknowledgement:
          type: boolean
          description: The dashboard highlights these. Set by the sweep, not here.
          readOnly: true
      required:
      - assigned_to
      - awaiting_acknowledgement
      - created_at
      - id
      - is_overdue
      - latitude
      - longitude
      - title
    MissionPhoto:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        client_uuid:
          type: string
          format: uuid
        image:
          type: string
          format: uri
        captured_latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        captured_longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        captured_at:
          type: string
          format: date-time
          nullable: true
        uploaded_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - client_uuid
      - id
      - image
      - uploaded_at
    Note:
      type: object
      properties:
        text:
          type: string
      required:
      - text
    Notification:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        notification_type:
          allOf:
          - $ref: '#/components/schemas/NotificationTypeEnum'
          readOnly: true
        notification_type_display:
          type: string
          readOnly: true
        title:
          type: string
          readOnly: true
        body:
          type: string
          readOnly: true
        mission_id:
          type: integer
          readOnly: true
        mission_title:
          type: string
          readOnly: true
        mission_status:
          type: string
          readOnly: true
        is_read:
          type: boolean
          readOnly: true
        read_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - body
      - created_at
      - id
      - is_read
      - mission_id
      - mission_status
      - mission_title
      - notification_type
      - notification_type_display
      - read_at
      - title
    NotificationTypeEnum:
      enum:
      - mission_assigned
      - mission_cancelled
      - mission_unacknowledged
      - dispatcher_message
      - panic_alert
      type: string
      description: |-
        * `mission_assigned` - Mission Assigned
        * `mission_cancelled` - Mission Cancelled
        * `mission_unacknowledged` - Mission Not Acknowledged
        * `dispatcher_message` - Dispatcher Message
        * `panic_alert` - Panic Alert
    OfficerBrief:
      type: object
      description: |-
        The minimum identifying fields for a person, used by every app that has to
        label a row with an officer. Defined once in core: two apps declaring their
        own version produces two schema components with the same name, which makes
        the generated OpenAPI document wrong.
      properties:
        id:
          type: integer
        full_name:
          type: string
        badge_number:
          type: string
      required:
      - badge_number
      - full_name
      - id
    PaginatedNotificationList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
    PaginatedUserList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/User'
    PanicEvent:
      type: object
      description: |-
        One alert in full — what trigger, cancel, and resolve all return.

        `resolved_by` is expanded rather than left as an id so the dashboard can
        show who closed it without a second request.
      properties:
        id:
          type: integer
          readOnly: true
        shift:
          type: integer
        status:
          $ref: '#/components/schemas/PanicEventStatusEnum'
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        accuracy_m:
          type: number
          format: double
          nullable: true
        battery_level:
          type: integer
          maximum: 100
          minimum: 0
          nullable: true
          description: Percentage, 0-100. A dying battery explains a trail that stops.
        triggered_at:
          type: string
          format: date-time
          readOnly: true
        cancelled_at:
          type: string
          format: date-time
          nullable: true
        resolved_at:
          type: string
          format: date-time
          nullable: true
        resolved_by:
          allOf:
          - $ref: '#/components/schemas/OfficerBrief'
          readOnly: true
          nullable: true
        notes:
          type: string
      required:
      - id
      - latitude
      - longitude
      - resolved_by
      - shift
      - triggered_at
    PanicEventStatusEnum:
      enum:
      - active
      - cancelled
      - resolved
      type: string
      description: |-
        * `active` - Active
        * `cancelled` - Cancelled
        * `resolved` - Resolved
    PanicResolve:
      type: object
      description: POST /api/v1/panic/{id}/resolve/ body. What happened, in the closer's
        words.
      properties:
        notes:
          type: string
          description: What the alert turned out to be and how it was handled.
    PanicTrigger:
      type: object
      description: |-
        POST /api/v1/panic/ body.

        Position is required, unlike the optional one on Start Shift: an alert the
        dispatcher cannot put on the map is not an alert. Battery and accuracy are
        optional because the phone may not have them, and waiting for a better GPS
        fix before sending is the wrong trade for this button.
      properties:
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        accuracy_m:
          type: number
          format: double
          nullable: true
        battery_level:
          type: integer
          maximum: 100
          minimum: 0
          nullable: true
      required:
      - latitude
      - longitude
    PasswordResetConfirm:
      type: object
      properties:
        badge_number:
          type: string
        code:
          type: string
        new_password:
          type: string
          writeOnly: true
          minLength: 8
      required:
      - badge_number
      - code
      - new_password
    PasswordResetRequest:
      type: object
      properties:
        badge_number:
          type: string
      required:
      - badge_number
    PatchedSystemSetting:
      type: object
      description: |-
        The settings object, flat rather than a list of key/value rows.

        Built from the registry so a new setting appears in the API docs the
        moment it is added to DEFINITIONS — no second place to update.

        Validation still happens in `registry.set_settings`; this exists so
        drf-spectacular can render a request body and so the docs show each
        field's bounds. Duplicating the checks here would give two sources of
        truth for the same rule.
      properties:
        location_ping_interval_seconds:
          type: integer
          maximum: 120
          minimum: 10
          description: How often the officer app records a location, in seconds.
        mission_ack_timeout_minutes:
          type: integer
          maximum: 60
          minimum: 1
          description: Minutes before an unacknowledged mission is flagged.
        location_retention_days:
          type: integer
          maximum: 365
          minimum: 1
          description: Location pings older than this are deleted.
        panic_cancel_grace_seconds:
          type: integer
          maximum: 60
          minimum: 5
