openapi: 3.0.3
info:
  title: Municipal Police Field Operations API
  version: 1.0.0
paths:
  /api/v1/areas/:
    get:
      operationId: v1_areas_list
      description: |-
        GET /api/v1/areas/ - the districts, for the dashboard's area filters.

        Any signed-in user: the officer app shows the same names on a mission, and
        there is nothing sensitive in a list of neighbourhoods.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Area'
          description: ''
  /api/v1/device-tokens/:
    post:
      operationId: v1_device_tokens_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceToken'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeviceToken'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeviceToken'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceToken'
          description: ''
  /api/v1/device-tokens/{id}/:
    delete:
      operationId: v1_device_tokens_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/location-pings/bulk/:
    post:
      operationId: v1_location_pings_bulk_create
      description: |-
        POST /api/v1/location-pings/bulk/ — §4.3 batch ingest.

        Returns counts rather than rows: the phone only needs to know the batch
        landed so it can clear those rows from Room.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkLocationPing'
            examples:
              OneFix:
                value:
                  pings:
                  - client_uuid: 3f8a1c92-7d64-4e11-b0a5-9c2d81e4f7a3
                    latitude: 34.451028
                    longitude: 35.810472
                    accuracy_m: 12.5
                    battery_level: 78
                    network_type: mobile
                    recorded_at: '2026-09-10T17:30:00+03:00'
                summary: One fix
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BulkLocationPing'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BulkLocationPing'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResult'
          description: ''
  /api/v1/login/:
    post:
      operationId: v1_login_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Login'
          description: ''
  /api/v1/logout/:
    post:
      operationId: v1_logout_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Logout'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Logout'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Logout'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Logout'
          description: ''
  /api/v1/missions/:
    get:
      operationId: v1_missions_list
      description: |-
        GET  /api/v1/missions/  - list, filtered. Officers see only their own.
        POST /api/v1/missions/  - create (§4.4). Dispatcher and supervisor only.
      parameters:
      - in: query
        name: area_id
        schema:
          type: integer
        description: Filter by the district the mission is in.
      - in: query
        name: category
        schema:
          type: string
        description: Municipal, Sanitation, Traffic, Infrastructure
      - in: query
        name: date
        schema:
          type: string
        description: Missions created on this day, YYYY-MM-DD.
      - in: query
        name: officer_id
        schema:
          type: integer
        description: Filter by assigned officer.
      - in: query
        name: open
        schema:
          type: string
        description: true for missions not yet closed.
      - in: query
        name: priority
        schema:
          type: string
        description: low, medium, high, urgent
      - in: query
        name: status
        schema:
          type: string
        description: new, assigned, in_progress, completed, cancelled
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MissionList'
          description: ''
    post:
      operationId: v1_missions_create
      description: |-
        GET  /api/v1/missions/  - list, filtered. Officers see only their own.
        POST /api/v1/missions/  - create (§4.4). Dispatcher and supervisor only.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MissionCreate'
            examples:
              CreateAndAssignInOneStep:
                value:
                  title: Traffic obstruction on Al-Mina road
                  description: Abandoned vehicle blocking the right lane.
                  latitude: 34.4367
                  longitude: 35.8497
                  address: Al-Mina, Tripoli
                  priority: high
                  assigned_to_ids:
                  - 4
                  - 7
                summary: Create and assign in one step
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MissionCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MissionCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissionDetail'
          description: ''
  /api/v1/missions/{mission_id}/:
    get:
      operationId: v1_missions_retrieve
      description: GET /api/v1/missions/{id}/ - the drawer, with the full timeline
        (§4.6).
      parameters:
      - in: path
        name: mission_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissionDetail'
          description: ''
  /api/v1/missions/{mission_id}/assign/:
    post:
      operationId: v1_missions_assign_create
      description: |-
        POST /api/v1/missions/{id}/assign/ - assign, or reassign before an officer
        starts it. Dispatcher and supervisor only.
      parameters:
      - in: path
        name: mission_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Assign'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Assign'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Assign'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissionDetail'
          description: ''
  /api/v1/missions/{mission_id}/cancel/:
    post:
      operationId: v1_missions_cancel_create
      description: POST /api/v1/missions/{id}/cancel/ - reason required (§4.4).
      parameters:
      - in: path
        name: mission_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Cancel'
            examples:
              CancelADuplicate:
                value:
                  reason: 'Duplicate of mission #12.'
                summary: Cancel a duplicate
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Cancel'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Cancel'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissionDetail'
          description: ''
  /api/v1/missions/{mission_id}/complete/:
    post:
      operationId: v1_missions_complete_create
      description: POST /api/v1/missions/{id}/complete/ - officer finished (§4.4).
      parameters:
      - in: path
        name: mission_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Complete'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Complete'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Complete'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissionDetail'
          description: ''
  /api/v1/missions/{mission_id}/notes/:
    post:
      operationId: v1_missions_notes_create
      description: POST /api/v1/missions/{id}/notes/ - append to the timeline.
      parameters:
      - in: path
        name: mission_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Note'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Note'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Note'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissionDetail'
          description: ''
  /api/v1/missions/{mission_id}/photos/:
    post:
      operationId: v1_missions_photos_create
      description: |-
        POST /api/v1/missions/{id}/photos/ - attach evidence (§4.4).

        Multipart, and deduped on client_uuid. A retried upload returns 200 with
        the existing photo rather than an error, so the phone can clear its queue.
      parameters:
      - in: path
        name: mission_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PhotoUpload'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PhotoUpload'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissionPhoto'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissionPhoto'
          description: ''
  /api/v1/missions/{mission_id}/start/:
    post:
      operationId: v1_missions_start_create
      description: POST /api/v1/missions/{id}/start/ - officer is on it.
      parameters:
      - in: path
        name: mission_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Position'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Position'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Position'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissionDetail'
          description: ''
  /api/v1/notifications/:
    get:
      operationId: v1_notifications_list
      description: GET /api/v1/notifications/
      summary: List the current user's notifications
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: type
        schema:
          type: string
        description: Filter by notification_type.
      - in: query
        name: unread
        schema:
          type: boolean
        description: Pass true to return only unread notifications.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNotificationList'
          description: ''
  /api/v1/notifications/{id}/read/:
    post:
      operationId: v1_notifications_read_create
      description: POST /api/v1/notifications/{id}/read/
      summary: Mark one notification as read
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
          description: ''
  /api/v1/notifications/mark-all-read/:
    post:
      operationId: v1_notifications_mark_all_read_create
      description: POST /api/v1/notifications/mark-all-read/
      summary: Mark all of the current user's notifications as read
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  marked_read:
                    type: integer
          description: ''
  /api/v1/notifications/unread-count/:
    get:
      operationId: v1_notifications_unread_count_retrieve
      description: |-
        GET /api/v1/notifications/unread-count/

        Separate from the list endpoint because the dashboard badge polls this
        far more often than it opens the list — no reason to serialise rows the
        caller is going to discard.
      summary: Unread notification count for the current user
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  unread_count:
                    type: integer
          description: ''
  /api/v1/officers/{officer_id}/trail/:
    get:
      operationId: v1_officers_trail_retrieve
      description: |-
        GET /api/v1/officers/{id}/trail/?date=YYYY-MM-DD — §4.6 the day's path.

        §5 also gives an officer the right to see their own history, so an officer
        may call this for themselves and no one else.
      parameters:
      - in: path
        name: officer_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/panic/:
    post:
      operationId: v1_panic_create
      description: |-
        POST /api/v1/panic/ — §4.7 raise the alarm.

        201 for a new alert, 200 when one was already active. Idempotent, because
        an officer in trouble taps more than once and a phone on a bad connection
        retries; neither may raise a second alert.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PanicTrigger'
            examples:
              PanicWithAGoodFix:
                value:
                  latitude: 34.4367
                  longitude: 35.8497
                  accuracy_m: 12.5
                  battery_level: 38
                summary: Panic with a good fix
              PositionOnly:
                value:
                  latitude: 34.4367
                  longitude: 35.8497
                summary: Position only
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PanicTrigger'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PanicTrigger'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PanicEvent'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PanicEvent'
          description: ''
  /api/v1/panic/{event_id}/cancel/:
    post:
      operationId: v1_panic_cancel_create
      description: |-
        POST /api/v1/panic/{id}/cancel/ — §4.7, the officer withdraws it.

        Own alert only, and only inside the grace window. Past that the dispatcher
        has already seen it and may be responding, so it takes a resolve.
      parameters:
      - in: path
        name: event_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PanicEvent'
          description: ''
  /api/v1/panic/{event_id}/location/:
    get:
      operationId: v1_panic_location_retrieve
      description: |-
        GET /api/v1/panic/{id}/location/; where a colleague in panic is now.

        For the officers notified of a nearby alert. Only while the alert is
        active: a 404 tells the phone the incident is over and it can stop
        following. Officers only; dispatchers already have the map.
      parameters:
      - in: path
        name: event_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PanicLocation'
          description: ''
  /api/v1/panic/{event_id}/resolve/:
    post:
      operationId: v1_panic_resolve_create
      description: POST /api/v1/panic/{id}/resolve/ — §4.7, a dispatcher closes it.
      parameters:
      - in: path
        name: event_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PanicResolve'
            examples:
              ClosedAfterContact:
                value:
                  notes: Reached the officer by radio; false alarm, no unit sent.
                summary: Closed after contact
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PanicResolve'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PanicResolve'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PanicEvent'
          description: ''
  /api/v1/panic/active/:
    get:
      operationId: v1_panic_active_list
      description: |-
        GET /api/v1/panic/active/ — §4.6, the red pulsing marker.

        Only alerts still open. Cancelled and resolved ones are kept forever as
        audit records but must never reappear on the map.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActivePanic'
          description: ''
  /api/v1/password-reset/:
    post:
      operationId: v1_password_reset_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetRequest'
          description: ''
  /api/v1/password-reset/confirm/:
    post:
      operationId: v1_password_reset_confirm_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetConfirm'
          description: ''
  /api/v1/reports/activity/:
    get:
      operationId: v1_reports_activity_list
      description: |-
        GET /api/v1/reports/activity/ - what happened on one day, in order.

        Backs the Time Snapshot screen ("what went on in this area between these
        hours") and the officer report's timeline ("what did this officer do
        today"). Same question, different filters.
      parameters:
      - in: query
        name: area_id
        schema:
          type: integer
        description: Only what happened in this area.
      - in: query
        name: date
        schema:
          type: string
        description: Day to look at, YYYY-MM-DD.
        required: true
      - in: query
        name: from_time
        schema:
          type: string
        description: Start of the window, HH:MM. Defaults to the start of the day.
      - in: query
        name: officer_id
        schema:
          type: integer
        description: Only what this officer took part in.
      - in: query
        name: to_time
        schema:
          type: string
        description: End of the window, HH:MM. Defaults to the end of the day.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActivityRow'
          description: ''
  /api/v1/reports/daily/:
    get:
      operationId: v1_reports_daily_retrieve
      description: |-
        GET /api/v1/reports/daily/

        Generate a daily activity report for one officer.
      parameters:
      - in: query
        name: date
        schema:
          type: string
        description: Report date, YYYY-MM-DD.
        required: true
      - in: query
        name: officer_id
        schema:
          type: integer
        description: Officer to generate the report for.
        required: true
      - in: query
        name: status
        schema:
          type: string
        description: Filter missions by status.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyOfficerReport'
          description: ''
  /api/v1/reports/daily/export/pdf/:
    get:
      operationId: v1_reports_daily_export_pdf_retrieve
      description: |-
        GET /api/v1/reports/daily/export/pdf/

        Export a daily activity report as PDF.
      parameters:
      - in: query
        name: date
        schema:
          type: string
        description: Report date, YYYY-MM-DD.
        required: true
      - in: query
        name: officer_id
        schema:
          type: integer
        description: Officer to generate the report for.
        required: true
      - in: query
        name: status
        schema:
          type: string
        description: Filter missions by status.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
                format: binary
          description: ''
  /api/v1/reports/daily/export/xlsx/:
    get:
      operationId: v1_reports_daily_export_xlsx_retrieve
      description: |-
        GET /api/v1/reports/daily/export/xlsx/

        Export a daily activity report as a right-to-left Excel workbook.
      parameters:
      - in: query
        name: date
        schema:
          type: string
        description: Report date, YYYY-MM-DD.
        required: true
      - in: query
        name: officer_id
        schema:
          type: integer
        description: Officer to generate the report for.
        required: true
      - in: query
        name: status
        schema:
          type: string
        description: Filter missions by status.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
                format: binary
          description: ''
  /api/v1/reports/daily/summary/:
    get:
      operationId: v1_reports_daily_summary_retrieve
      description: |-
        GET /api/v1/reports/daily/summary/ - section 4.8, the whole shift for one day.

        The per-officer report answers for one person and backs the exports; this
        one backs the dashboard table listing everyone who was on duty.
      parameters:
      - in: query
        name: area_id
        schema:
          type: integer
        description: Only officers who worked in this area.
      - in: query
        name: date
        schema:
          type: string
        description: Report date, YYYY-MM-DD.
        required: true
      - in: query
        name: status
        schema:
          type: string
        description: Filter missions by status.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailySummary'
          description: ''
  /api/v1/reports/officer/:
    get:
      operationId: v1_reports_officer_retrieve
      description: |-
        GET /api/v1/reports/officer/ - the page behind an officer's name.

        Day, week or custom range: the screen picks the span, this answers for it.
      parameters:
      - in: query
        name: end_date
        schema:
          type: string
        description: End date, YYYY-MM-DD.
        required: true
      - in: query
        name: officer_id
        schema:
          type: integer
        description: The officer to report on.
        required: true
      - in: query
        name: start_date
        schema:
          type: string
        description: Start date, YYYY-MM-DD. Use the same day twice for a single day.
        required: true
      - in: query
        name: status
        schema:
          type: string
        description: Only missions with this status, in the history and the counts.
      tags:
