components:
  schemas:
    ActiveOfficer:
      type: object
      description: |-
        The contract for GET /shifts/active/ — the shape web builds against.
        Agreed before either side codes; see docs/CONTRACT-shifts-active.md.
      properties:
        officer:
          $ref: '#/components/schemas/OfficerBrief'
        status:
          type: string
        shift_started_at:
          type: string
          format: date-time
        shift_duration_seconds:
          type: integer
          description: Length of the current shift (stint) so far, not clipped to
            today.
        duty_seconds_today:
          type: integer
          description: Every stint today, the current one included, clipped to local
            midnight.
        target_seconds:
          type: integer
          description: The daily duty target (daily_duty_target_hours). A target,
            not a cap.
        distance_covered_m:
          type: integer
        latest_ping:
          allOf:
          - $ref: '#/components/schemas/LocationPing'
          nullable: true
        position_source:
          type: string
          nullable: true
        current_mission:
          allOf:
          - $ref: '#/components/schemas/CurrentMission'
          nullable: true
      required:
      - current_mission
      - distance_covered_m
      - duty_seconds_today
      - latest_ping
      - officer
      - position_source
      - shift_duration_seconds
      - shift_started_at
      - status
      - target_seconds
    ActivePanic:
      type: object
      description: |-
        The contract for GET /api/v1/panic/active/ — what feeds the red pulsing
        marker in §4.6.

        Deliberately narrow: name, badge, and where they are. The outcome columns
        are all empty on an active alert, so sending them would be noise on an
        endpoint every open dashboard polls.
      properties:
        id:
          type: integer
          readOnly: true
        officer:
          allOf:
          - $ref: '#/components/schemas/OfficerBrief'
          readOnly: true
        shift:
          type: integer
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        accuracy_m:
          type: number
          format: double
          nullable: true
        battery_level:
          type: integer
          maximum: 100
          minimum: 0
          nullable: true
          description: Percentage, 0-100. A dying battery explains a trail that stops.
        triggered_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - id
      - latitude
      - longitude
      - officer
      - shift
      - triggered_at
    ActivityRow:
      type: object
      description: |-
        One line of the activity feed: who did what, when and where.

        `officer` is who acted, and is null for the things the system did by
        itself. `area` is null when the
        position falls outside every district.
      properties:
        at:
          type: string
          format: date-time
        activity:
          type: string
        activity_label:
          type: string
        officer:
          allOf:
          - $ref: '#/components/schemas/OfficerBrief'
          nullable: true
        area:
          type: string
          nullable: true
        area_id:
          type: integer
          nullable: true
        details:
          type: string
        mission_id:
          type: integer
          nullable: true
        panic_id:
          type: integer
          nullable: true
      required:
      - activity
      - activity_label
      - area
      - area_id
      - at
      - details
      - mission_id
      - officer
      - panic_id
    Area:
      type: object
      description: The district list behind every "area" dropdown.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 120
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        radius_m:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: How far from the centre still counts as this area, in metres.
      required:
      - id
      - latitude
      - longitude
      - name
    Assign:
      type: object
      properties:
        officer_ids:
          type: array
          items:
            type: integer
      required:
      - officer_ids
    BulkLocationPing:
      type: object
      properties:
        pings:
          type: array
          items:
            $ref: '#/components/schemas/LocationPingUpload'
          maxItems: 500
      required:
      - pings
    Cancel:
      type: object
      properties:
        reason:
          type: string
          description: Required. Stored on the mission and in the timeline.
      required:
      - reason
    CategoryEnum:
      enum:
      - Municipal
      - Sanitation
      - Traffic
      - Infrastructure
      type: string
      description: |-
        * `Municipal` - Municipal
        * `Sanitation` - Sanitation
        * `Traffic` - Traffic
        * `Infrastructure` - Infrastructure
    Complete:
      type: object
      description: Where the officer was when they started or completed.
      properties:
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        notes:
          type: string
          default: ''
    CurrentMission:
      type: object
      description: |-
        The mission an officer is on, as the map row carries it.

        Four fields on purpose: the drawer calls GET /missions/{id}/ for the full
        record and its timeline, so widening this would ship the same data twice.
      properties:
        id:
          type: integer
        title:
          type: string
        priority:
          type: string
        status:
          type: string
      required:
      - id
      - priority
      - status
      - title
    DailyDuty:
      type: object
      description: What GET /shifts/today/ returns.
      properties:
        date:
          type: string
          format: date
        duty_seconds_today:
          type: integer
          description: Duty on this local day across every shift, the active one included.
            A shift that started yesterday counts only from midnight.
        target_seconds:
          type: integer
          description: The daily duty target. A target, not a cap.
        active_shift_started_at:
          type: string
          format: date-time
          nullable: true
        active_shift_seconds:
          type: integer
          description: Length of the current shift so far, not clipped to today. 0
            when off shift.
      required:
      - active_shift_seconds
      - active_shift_started_at
      - date
      - duty_seconds_today
      - target_seconds
    DailyOfficerReport:
      type: object
      properties:
        officer_id:
          type: integer
        officer_name:
          type: string
        date:
          type: string
          format: date
        hours_on_duty:
          type: number
          format: double
        distance_covered_m:
          type: integer
        missions_assigned:
          type: integer
        missions_completed:
          type: integer
        missions_cancelled:
          type: integer
        panic_events:
          type: integer
      required:
      - date
      - distance_covered_m
      - hours_on_duty
      - missions_assigned
      - missions_cancelled
      - missions_completed
      - officer_id
      - officer_name
      - panic_events
    DailySummary:
      type: object
      description: GET /api/v1/reports/daily/summary/ - every officer on duty that
        day.
      properties:
        date:
          type: string
          format: date
        totals:
          $ref: '#/components/schemas/DailySummaryTotals'
        officers:
          type: array
          items:
            $ref: '#/components/schemas/DailySummaryOfficer'
      required:
      - date
      - officers
      - totals
    DailySummaryOfficer:
      type: object
      description: One row of the Daily Summary table.
      properties:
        officer_id:
          type: integer
        officer_name:
          type: string
